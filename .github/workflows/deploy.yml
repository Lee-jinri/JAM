name: Deploy to EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '17'

    - name: Start Oracle XE (with seed schema/data)
      run: |
        docker run -d --name oracle-ci \
          -p 1521:1521 \
          -e ORACLE_PASSWORD=jam1234 \
          -e APP_USER=jam \
          -e APP_USER_PASSWORD=jam1234 \
          -v "${{ github.workspace }}/.github/ci/init-ci.sql:/container-entrypoint-initdb.d/init-ci.sql" \
          gvenzl/oracle-xe:21-slim

    - name: Wait for Oracle to become ready
      run: |
        for i in $(seq 1 40); do
          if docker exec -i oracle-ci sqlplus -s jam/jam1234@localhost/XEPDB1 < .github/ci/wait-for-oracle.sql 2>/dev/null | grep -q "READY"; then
            echo "Oracle is ready"
            exit 0
          fi
          echo "Waiting for Oracle... ($i/40)"
          sleep 15
        done
        echo "Oracle did not become ready in time"
        docker logs oracle-ci
        exit 1

    - name: Run tests
      env:
        SPRING_PROFILES_ACTIVE: ci
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
        KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
        KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
        LOCATION_CONSUMER_KEY: ${{ secrets.LOCATION_CONSUMER_KEY }}
        LOCATION_CONSUMER_SECRET: ${{ secrets.LOCATION_CONSUMER_SECRET }}
        LOCATION_SAVE_PATH: ${{ secrets.LOCATION_SAVE_PATH }}
        FILE_UPLOAD_DIR: ${{ secrets.FILE_UPLOAD_DIR }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      run: mvn -B test

    - name: Show Oracle logs on failure
      if: failure()
      run: docker logs oracle-ci

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '17'

    - name: Build with Maven
      run: mvn -B package -Dmaven.test.skip=true
      working-directory: ./

    - name: List JAR files
      run: ls -lh ./target

    - name: Debug JAR path
      run: |
        echo "SEARCHING:"
        find -name "*.jar" -type f

    - name: Copy JAR file with native scp
      env:
        EC2_KEY: ${{ secrets.EC2_KEY }}
      run: |
        echo "$EC2_KEY" > /tmp/ec2_key.pem
        chmod 400 /tmp/ec2_key.pem

        JAR_FILE=$(find "./target" -name "*.jar" -type f | head -n 1)
        if [ -z "$JAR_FILE" ]; then
          echo "ERROR: JAR 파일을 찾을 수 없습니다"
          exit 1
        fi

        echo "배포할 JAR 파일: $JAR_FILE"
        ls -lh "$JAR_FILE"

        scp -v -o StrictHostKeyChecking=no -i /tmp/ec2_key.pem \
          "$JAR_FILE" \
          ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/app.jar

        rm -f /tmp/ec2_key.pem

    - name: Restart Application on EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        script: |

          echo "애플리케이션 재시작..."
          sudo systemctl restart myapp

          echo "배포 완료. 5초 후 로그 확인 시작..."
          sleep 5
          sudo journalctl -u myapp -n 50
